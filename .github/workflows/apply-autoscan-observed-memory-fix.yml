name: Apply autoscan observed-memory fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/autoscan-enable-observed-memory' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autoscan-enable-observed-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply guarded fix
        run: python tools/apply_autoscan_observed_memory_fix.py
      - name: Validate syntax
        run: python -m py_compile sniperplug/cogs/auto_scan_runner.py sniperplug/services/autoscan_observed_price_memory.py tests/test_autoscan_observed_memory_wiring.py
      - name: Run targeted tests
        run: python -m pytest -q tests/test_autoscan_observed_memory_wiring.py tests/test_autoscan_policy_structure.py tests/test_native_autoscan_selection_static.py
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/cogs/auto_scan_runner.py tests/test_autoscan_observed_memory_wiring.py ACTIVE_TASK.md
          git diff --cached --quiet && exit 0
          git commit -m "Enable bounded observed price memory in autoscan"
          git push
