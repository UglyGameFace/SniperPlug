name: Apply autoscan policy cleanup

on:
  push:
    branches:
      - chore/autoscan-policy-cleanup-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/autoscan-policy-cleanup-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cleanup
        run: python tools/apply_autoscan_policy_cleanup.py
      - name: Validate syntax
        run: python -m py_compile sniperplug/cogs/auto_scan_runner.py tests/test_autoscan_policy_structure.py
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/cogs/auto_scan_runner.py tests/test_autoscan_policy_structure.py
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate autoscan route policy"
          git push
