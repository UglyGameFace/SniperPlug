name: Apply broad autoscan fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/autoscan-broad-scheduled-coverage' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autoscan-broad-scheduled-coverage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply guarded fix
        run: python tools/apply_broad_scheduled_autoscan_fix.py
      - name: Validate syntax
        run: python -m py_compile sniperplug/cogs/native_auto_scan_runner.py sniperplug/bot.py tests/test_native_autoscan_selection_static.py
      - name: Run targeted tests
        run: python -m pytest -q tests/test_native_autoscan_selection_static.py tests/test_autoscan_policy_structure.py tests/test_autoscan_no_hang_static.py
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/cogs/native_auto_scan_runner.py sniperplug/bot.py tests/test_native_autoscan_selection_static.py ACTIVE_TASK.md
          git diff --cached --quiet && exit 0
          git commit -m "Spread scheduled autoscan routes across categories"
          git push
