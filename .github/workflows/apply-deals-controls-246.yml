name: Validate deals controls 246

on:
  push:
    branches:
      - fix/deals-live-timeout-245
    paths:
      - '.github/workflows/apply-deals-controls-246.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static validation
        run: |
          pip check
          python -m compileall -q sniperplug tests *.py
          git diff --check origin/main...HEAD
      - name: Focused regressions
        run: pytest -q tests/test_deals_live_timeout_245.py tests/test_deals_discover_hardening_244.py
      - name: Full regression suite
        run: pytest -q
