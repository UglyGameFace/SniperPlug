name: Apply deals controls 246

on:
  push:
    branches:
      - fix/deals-live-timeout-245
    paths:
      - 'ACTIVE_TASK.md'
      - '.github/workflows/apply-deals-controls-246.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply marked patch and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ACTIVE_TASK.md').read_text()
          start = '<!-- DEALS_PATCH_START -->'
          end = '<!-- DEALS_PATCH_END -->'
          if start not in text or end not in text:
              raise SystemExit(0)
          code = text.split(start, 1)[1].split(end, 1)[0]
          if code.startswith('\n'):
              code = code[1:]
          Path('/tmp/deals_patch.py').write_text(code)
          PY
          if [ ! -f /tmp/deals_patch.py ]; then
            exit 0
          fi
          python /tmp/deals_patch.py
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          python -m compileall -q sniperplug tests *.py
          pytest -q tests/test_deals_live_timeout_245.py tests/test_deals_discover_hardening_244.py
          git diff --check
          if git diff --quiet -- sniperplug/cogs/unified_deal_scanner.py; then
            echo 'No scanner changes produced.'
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sniperplug/cogs/unified_deal_scanner.py
          git commit -m '[deals-controls-246] apply focused live controls patch'
          git push origin HEAD:fix/deals-live-timeout-245
