name: Apply deals new-drop safety 246

on:
  push:
    branches:
      - fix/deals-live-timeout-245
    paths:
      - '.github/workflows/apply-deals-newdrop-safety-246.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply proof-status edge fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/cogs/unified_deal_scanner.py')
          text = path.read_text()

          helper_anchor = 'def build_compact_deal_card_embed(card: DealCard, *, verified: bool) -> discord.Embed:\n'
          helper = '''def _is_verified_result_card(\n    result: DealFinderResult | None,\n    card: DealCard,\n) -> bool:\n    if result is None:\n        return False\n    return any(card is verified for verified in result.verified_cards)\n\n\n'''
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit('compact card helper anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old = '''        for card in cards:\n            await interaction.followup.send(\n                embed=build_compact_deal_card_embed(card, verified=True),\n                ephemeral=True,\n            )\n'''
          new = '''        for card in cards:\n            await interaction.followup.send(\n                embed=build_compact_deal_card_embed(\n                    card,\n                    verified=_is_verified_result_card(self.view.result, card),\n                ),\n                ephemeral=True,\n            )\n'''
          if old not in text:
              raise SystemExit('New / Drops compact rendering block missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          python -m compileall -q sniperplug tests *.py
          pytest -q tests/test_deals_live_timeout_245.py tests/test_deals_discover_hardening_244.py
          pytest -q
          git diff --check origin/main...HEAD
      - name: Commit edge fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sniperplug/cogs/unified_deal_scanner.py
          git commit -m '[deals-controls-246] preserve New / Drops proof status'
          git push origin HEAD:fix/deals-live-timeout-245
