name: Apply eBay watcher payload

on:
  push:
    branches:
      - feature/ebay-big-ticket-watcher
    paths:
      - tools/ebay_impl.part*.b64
      - .github/workflows/apply-ebay-watcher-payload.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out watcher branch
        uses: actions/checkout@v4
        with:
          ref: feature/ebay-big-ticket-watcher
          fetch-depth: 0

      - name: Verify and expand implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          parts = sorted(Path("tools").glob("ebay_impl.part*.b64"))
          if len(parts) != 5:
              raise SystemExit(f"expected 5 payload parts, found {len(parts)}")
          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = "f05495ef96e55522fc6cb70203b1371ee3a77ee741a9820c9411263ac8730f75"
          if digest != expected:
              raise SystemExit(f"payload checksum mismatch: {digest}")
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              root = Path.cwd().resolve()
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              archive.extractall(root)
          PY

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTIVE_TASK.md discloud.ebay-watcher.config docs/EBAY_WATCHER.md ebay_watcher_main.py sniperplug tests/test_ebay_watcher.py
          git diff --cached --check
          git commit -m "Implement verified eBay big-ticket watcher"
          git push origin HEAD:feature/ebay-big-ticket-watcher

# Retrigger after workflow registration.
