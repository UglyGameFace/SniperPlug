name: Apply Walmart Cash proof hardening

# Branch-only source applicator. Removed before merge.
on:
  push:
    branches:
      - fix/walmart-cash-proven-filter

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walmart-cash-proven-filter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install pytest
      - name: Apply source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          truth = Path('sniperplug/services/walmart_cash_api_truth.py')
          text = truth.read_text()
          text = text.replace(
              'PROMO_CONTEXT_MARKERS = (\n',
              'WALMART_CASH_AMOUNT_KEY_MARKERS = (\n'
              '    "amount",\n'
              '    "value",\n'
              '    "savings",\n'
              '    "saving",\n'
              '    "reward",\n'
              '    "rebate",\n'
              ')\n\n\nPROMO_CONTEXT_MARKERS = (\n',
              1,
          )
          old_object = '''def _amount_from_cash_object(obj: dict[str, Any], *, path: str, text: str) -> float | None:\n    best: float | None = None\n\n    for key, value in obj.items():\n        key_norm = _norm(key)\n        path_norm = _norm(path)\n        is_cash_key = "walmartcash" in key_norm or "walmartcash" in path_norm\n        is_amount_key = any(token in key_norm for token in ("amount", "value", "savings", "saving", "reward", "cash"))\n\n        if not (is_cash_key or is_amount_key):\n            continue\n\n        parsed = _float_or_none(value)\n        if parsed is not None and (best is None or parsed > best):\n            best = parsed\n\n    nearby = _money_near_walmart_cash(text)\n    if nearby is not None and (best is None or nearby > best):\n        best = nearby\n\n    return best\n'''
          new_object = '''def _amount_from_cash_object(obj: dict[str, Any], *, path: str, text: str) -> float | None:\n    best: float | None = None\n\n    for key, value in obj.items():\n        key_norm = _norm(key)\n        if not _is_dedicated_cash_amount_key(key_norm):\n            continue\n        parsed = _float_or_none(value)\n        if parsed is not None and (best is None or parsed > best):\n            best = parsed\n\n    nearby = _money_near_walmart_cash(text)\n    if nearby is not None and (best is None or nearby > best):\n        best = nearby\n\n    return best\n'''
          if old_object not in text:
              raise SystemExit('cash object amount block not found')
          text = text.replace(old_object, new_object, 1)

          old_leaf = '''def _amount_from_leaf(path: str, value: Any, *, text: str) -> float | None:\n    path_norm = _norm(path)\n    if "walmartcash" in path_norm or any(token in path_norm for token in ("amount", "value", "savings", "saving", "reward", "cash")):\n        parsed = _float_or_none(value)\n        if parsed is not None:\n            return parsed\n\n    return _money_near_walmart_cash(text)\n'''
          new_leaf = '''def _amount_from_leaf(path: str, value: Any, *, text: str) -> float | None:\n    path_norm = _norm(path)\n    leaf_key = _norm(path.rsplit(".", 1)[-1].split("[", 1)[0])\n    if "walmartcash" in path_norm and _is_dedicated_cash_amount_key(leaf_key):\n        parsed = _float_or_none(value)\n        if parsed is not None:\n            return parsed\n\n    return _money_near_walmart_cash(text)\n'''
          if old_leaf not in text:
              raise SystemExit('cash leaf amount block not found')
          text = text.replace(old_leaf, new_leaf, 1)

          old_money = '''def _money_near_walmart_cash(text: str) -> float | None:\n    raw = str(text or "")\n    lowered = raw.lower()\n    normalized = _norm(lowered)\n\n    if "walmart cash" not in lowered and "walmartcash" not in normalized:\n        return None\n\n    matches = list(re.finditer(r"\\$\\s*(\\d+(?:\\.\\d{1,2})?)", raw))\n    if not matches:\n        return None\n\n    cash_positions = [idx for idx in (lowered.find("walmart cash"), normalized.find("walmartcash")) if idx >= 0]\n    cash_index = min(cash_positions or [0])\n    best = min(matches, key=lambda m: abs(m.start() - cash_index))\n    return _float_or_none(best.group(1))\n'''
          new_money = '''def _money_near_walmart_cash(text: str) -> float | None:\n    raw = " ".join(str(text or "").split())\n    lowered = raw.lower()\n    normalized = _norm(lowered)\n\n    if "walmart cash" not in lowered and "walmartcash" not in normalized:\n        return None\n\n    patterns = (\n        r"(?:get|earn|receive|claim)\\s+\\$\\s*(\\d+(?:\\.\\d{1,2})?)\\s+(?:in\\s+)?walmart\\s+cash",\n        r"\\$\\s*(\\d+(?:\\.\\d{1,2})?)\\s+walmart\\s+cash",\n        r"walmart\\s+cash[^$0-9]{0,40}\\$\\s*(\\d+(?:\\.\\d{1,2})?)",\n    )\n    for pattern in patterns:\n        match = re.search(pattern, lowered)\n        if match:\n            return _float_or_none(match.group(1))\n    return None\n\n\ndef _is_dedicated_cash_amount_key(key_norm: str) -> bool:\n    if not key_norm:\n        return False\n    if "walmartcash" in key_norm:\n        return any(marker in key_norm for marker in WALMART_CASH_AMOUNT_KEY_MARKERS)\n    return key_norm in WALMART_CASH_AMOUNT_KEY_MARKERS or any(\n        key_norm.endswith(marker) for marker in WALMART_CASH_AMOUNT_KEY_MARKERS\n    )\n'''
          if old_money not in text:
              raise SystemExit('cash nearby money block not found')
          text = text.replace(old_money, new_money, 1)
          truth.write_text(text)

          pdp = Path('sniperplug/services/walmart_pdp_cash_proof.py')
          text = pdp.read_text()
          old_pdp = '''    patterns = (\n        r"(?:earn|get|receive|save)\\s+(\\d+(?:\\.\\d{1,2})?)\\s+(?:in\\s+)?walmart\\s+cash",\n        r"walmart\\s+cash[^0-9$]{0,80}(\\d+(?:\\.\\d{1,2})?)",\n    )\n'''
          new_pdp = '''    patterns = (\n        r"(?:earn|get|receive|claim)\\s+\\$?\\s*(\\d+(?:\\.\\d{1,2})?)\\s+(?:in\\s+)?walmart\\s+cash",\n        r"\\$\\s*(\\d+(?:\\.\\d{1,2})?)\\s+walmart\\s+cash",\n        r"walmart\\s+cash[^0-9$]{0,40}\\$\\s*(\\d+(?:\\.\\d{1,2})?)",\n    )\n'''
          if old_pdp not in text:
              raise SystemExit('PDP amount pattern block not found')
          pdp.write_text(text.replace(old_pdp, new_pdp, 1))

          offers = Path('sniperplug/services/walmart_cash_offers.py')
          text = offers.read_text()
          text = text.replace(
              'DEFAULT_CASH_QUERIES = (\n    "walmart cash offers",\n',
              'DEFAULT_CASH_QUERIES = (\n    "manufacturer offers",\n    "get walmart cash",\n    "walmart cash offers",\n',
              1,
          )
          offers.write_text(text)

          test = Path('tests/test_walmart_cash_proven_filter.py')
          test.write_text('''from sniperplug.services.walmart_cash_api_truth import extract_walmart_cash_api_truth\nfrom sniperplug.services.walmart_cash_offers import walmart_cash_search_terms\nfrom sniperplug.services.walmart_pdp_cash_proof import extract_walmart_cash_from_pdp_html\n\n\ndef test_walmart_cash_object_does_not_treat_price_or_item_id_as_cash_amount():\n    item = {\n        "itemId": 987654321,\n        "price": 29.97,\n        "walmartCash": {\n            "eligible": True,\n            "itemId": 987654321,\n            "currentPrice": 29.97,\n        },\n    }\n    assert extract_walmart_cash_api_truth(item, current_price=29.97) is None\n\n\ndef test_dedicated_walmart_cash_amount_field_is_accepted():\n    item = {\n        "itemId": "123",\n        "manufacturerOffer": {\n            "label": "Get Walmart Cash",\n            "walmartCashAmount": 5.00,\n        },\n    }\n    proof = extract_walmart_cash_api_truth(item, current_price=20.00)\n    assert proof is not None\n    assert proof.amount == 5.00\n\n\ndef test_exact_action_text_with_amount_is_accepted_but_nearby_price_is_not():\n    valid = {"promotion": {"text": "Get $4.00 Walmart Cash after purchase"}}\n    invalid = {"promotion": {"text": "Walmart Cash available", "currentPrice": "$24.98"}}\n    assert extract_walmart_cash_api_truth(valid, current_price=24.98).amount == 4.00\n    assert extract_walmart_cash_api_truth(invalid, current_price=24.98) is None\n\n\ndef test_pdp_requires_cash_action_amount_not_any_nearby_dollar_value():\n    valid_html = '<html><body><label>Get $3.00 Walmart Cash</label></body></html>'\n    invalid_html = '<html><body><h1>Walmart Cash</h1><span>Price $18.97</span></body></html>'\n    assert extract_walmart_cash_from_pdp_html(valid_html, current_price=18.97).amount == 3.00\n    assert extract_walmart_cash_from_pdp_html(invalid_html, current_price=18.97) is None\n\n\ndef test_default_discovery_uses_official_manufacturer_offer_language():\n    terms = walmart_cash_search_terms(None)\n    assert terms[0] == "manufacturer offers"\n    assert "get walmart cash" in terms\n''')
          PY
      - name: Validate focused fix
        run: |
          python -m py_compile sniperplug/services/walmart_cash_api_truth.py sniperplug/services/walmart_pdp_cash_proof.py sniperplug/services/walmart_cash_offers.py tests/test_walmart_cash_proven_filter.py
          python -m pytest -q tests/test_walmart_cash_proven_filter.py
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sniperplug/services/walmart_cash_api_truth.py sniperplug/services/walmart_pdp_cash_proof.py sniperplug/services/walmart_cash_offers.py tests/test_walmart_cash_proven_filter.py
          git commit -m "Harden Walmart Cash proof and manufacturer-offer discovery"
          git push origin HEAD:fix/walmart-cash-proven-filter
