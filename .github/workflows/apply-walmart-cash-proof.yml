name: Apply Walmart Cash proof hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walmart-cash-proven-filter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install pytest
      - name: Apply source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          truth = Path('sniperplug/services/walmart_cash_api_truth.py')
          text = truth.read_text()
          text = text.replace(
              'PROMO_CONTEXT_MARKERS = (\n',
              'WALMART_CASH_AMOUNT_KEY_MARKERS = (\n'
              '    "amount",\n'
              '    "value",\n'
              '    "savings",\n'
              '    "saving",\n'
              '    "reward",\n'
              '    "rebate",\n'
              ')\n\n\nPROMO_CONTEXT_MARKERS = (\n',
              1,
          )
          old_object = '''def _amount_from_cash_object(obj: dict[str, Any], *, path: str, text: str) -> float | None:
    best: float | None = None

    for key, value in obj.items():
        key_norm = _norm(key)
        path_norm = _norm(path)
        is_cash_key = "walmartcash" in key_norm or "walmartcash" in path_norm
        is_amount_key = any(token in key_norm for token in ("amount", "value", "savings", "saving", "reward", "cash"))

        if not (is_cash_key or is_amount_key):
            continue

        parsed = _float_or_none(value)
        if parsed is not None and (best is None or parsed > best):
            best = parsed

    nearby = _money_near_walmart_cash(text)
    if nearby is not None and (best is None or nearby > best):
        best = nearby

    return best
'''
          new_object = '''def _amount_from_cash_object(obj: dict[str, Any], *, path: str, text: str) -> float | None:
    best: float | None = None

    for key, value in obj.items():
        key_norm = _norm(key)
        if not _is_dedicated_cash_amount_key(key_norm):
            continue
        parsed = _float_or_none(value)
        if parsed is not None and (best is None or parsed > best):
            best = parsed

    nearby = _money_near_walmart_cash(text)
    if nearby is not None and (best is None or nearby > best):
        best = nearby

    return best
'''
          if old_object not in text:
              raise SystemExit('cash object amount block not found')
          text = text.replace(old_object, new_object, 1)

          old_leaf = '''def _amount_from_leaf(path: str, value: Any, *, text: str) -> float | None:
    path_norm = _norm(path)
    if "walmartcash" in path_norm or any(token in path_norm for token in ("amount", "value", "savings", "saving", "reward", "cash")):
        parsed = _float_or_none(value)
        if parsed is not None:
            return parsed

    return _money_near_walmart_cash(text)
'''
          new_leaf = '''def _amount_from_leaf(path: str, value: Any, *, text: str) -> float | None:
    path_norm = _norm(path)
    leaf_key = _norm(path.rsplit(".", 1)[-1].split("[", 1)[0])
    if "walmartcash" in path_norm and _is_dedicated_cash_amount_key(leaf_key):
        parsed = _float_or_none(value)
        if parsed is not None:
            return parsed

    return _money_near_walmart_cash(text)
'''
          if old_leaf not in text:
              raise SystemExit('cash leaf amount block not found')
          text = text.replace(old_leaf, new_leaf, 1)

          old_money = '''def _money_near_walmart_cash(text: str) -> float | None:
    raw = str(text or "")
    lowered = raw.lower()
    normalized = _norm(lowered)

    if "walmart cash" not in lowered and "walmartcash" not in normalized:
        return None

    matches = list(re.finditer(r"\$\s*(\d+(?:\.\d{1,2})?)", raw))
    if not matches:
        return None

    cash_positions = [idx for idx in (lowered.find("walmart cash"), normalized.find("walmartcash")) if idx >= 0]
    cash_index = min(cash_positions or [0])
    best = min(matches, key=lambda m: abs(m.start() - cash_index))
    return _float_or_none(best.group(1))
'''
          new_money = '''def _money_near_walmart_cash(text: str) -> float | None:
    raw = " ".join(str(text or "").split())
    lowered = raw.lower()
    normalized = _norm(lowered)

    if "walmart cash" not in lowered and "walmartcash" not in normalized:
        return None

    patterns = (
        r"(?:get|earn|receive|claim)\s+\$\s*(\d+(?:\.\d{1,2})?)\s+(?:in\s+)?walmart\s+cash",
        r"\$\s*(\d+(?:\.\d{1,2})?)\s+walmart\s+cash",
        r"walmart\s+cash[^$0-9]{0,40}\$\s*(\d+(?:\.\d{1,2})?)",
    )
    for pattern in patterns:
        match = re.search(pattern, lowered)
        if match:
            return _float_or_none(match.group(1))
    return None


def _is_dedicated_cash_amount_key(key_norm: str) -> bool:
    if not key_norm:
        return False
    if "walmartcash" in key_norm:
        return any(marker in key_norm for marker in WALMART_CASH_AMOUNT_KEY_MARKERS)
    return key_norm in WALMART_CASH_AMOUNT_KEY_MARKERS or any(
        key_norm.endswith(marker) for marker in WALMART_CASH_AMOUNT_KEY_MARKERS
    )
'''
          if old_money not in text:
              raise SystemExit('cash nearby money block not found')
          text = text.replace(old_money, new_money, 1)
          truth.write_text(text)

          pdp = Path('sniperplug/services/walmart_pdp_cash_proof.py')
          text = pdp.read_text()
          old_pdp = '''    patterns = (
        r"(?:earn|get|receive|save)\s+(\d+(?:\.\d{1,2})?)\s+(?:in\s+)?walmart\s+cash",
        r"walmart\s+cash[^0-9$]{0,80}(\d+(?:\.\d{1,2})?)",
    )
'''
          new_pdp = '''    patterns = (
        r"(?:earn|get|receive|claim)\s+\$?\s*(\d+(?:\.\d{1,2})?)\s+(?:in\s+)?walmart\s+cash",
        r"\$\s*(\d+(?:\.\d{1,2})?)\s+walmart\s+cash",
        r"walmart\s+cash[^0-9$]{0,40}\$\s*(\d+(?:\.\d{1,2})?)",
    )
'''
          if old_pdp not in text:
              raise SystemExit('PDP amount pattern block not found')
          pdp.write_text(text.replace(old_pdp, new_pdp, 1))

          offers = Path('sniperplug/services/walmart_cash_offers.py')
          text = offers.read_text()
          text = text.replace(
              'DEFAULT_CASH_QUERIES = (\n    "walmart cash offers",\n',
              'DEFAULT_CASH_QUERIES = (\n    "manufacturer offers",\n    "get walmart cash",\n    "walmart cash offers",\n',
              1,
          )
          offers.write_text(text)

          test = Path('tests/test_walmart_cash_proven_filter.py')
          test.write_text('''from sniperplug.services.walmart_cash_api_truth import extract_walmart_cash_api_truth
from sniperplug.services.walmart_cash_offers import walmart_cash_search_terms
from sniperplug.services.walmart_pdp_cash_proof import extract_walmart_cash_from_pdp_html


def test_walmart_cash_object_does_not_treat_price_or_item_id_as_cash_amount():
    item = {
        "itemId": 987654321,
        "price": 29.97,
        "walmartCash": {
            "eligible": True,
            "itemId": 987654321,
            "currentPrice": 29.97,
        },
    }
    assert extract_walmart_cash_api_truth(item, current_price=29.97) is None


def test_dedicated_walmart_cash_amount_field_is_accepted():
    item = {
        "itemId": "123",
        "manufacturerOffer": {
            "label": "Get Walmart Cash",
            "walmartCashAmount": 5.00,
        },
    }
    proof = extract_walmart_cash_api_truth(item, current_price=20.00)
    assert proof is not None
    assert proof.amount == 5.00


def test_exact_action_text_with_amount_is_accepted_but_nearby_price_is_not():
    valid = {"promotion": {"text": "Get $4.00 Walmart Cash after purchase"}}
    invalid = {"promotion": {"text": "Walmart Cash available", "currentPrice": "$24.98"}}
    assert extract_walmart_cash_api_truth(valid, current_price=24.98).amount == 4.00
    assert extract_walmart_cash_api_truth(invalid, current_price=24.98) is None


def test_pdp_requires_cash_action_amount_not_any_nearby_dollar_value():
    valid_html = '<html><body><label>Get $3.00 Walmart Cash</label></body></html>'
    invalid_html = '<html><body><h1>Walmart Cash</h1><span>Price $18.97</span></body></html>'
    assert extract_walmart_cash_from_pdp_html(valid_html, current_price=18.97).amount == 3.00
    assert extract_walmart_cash_from_pdp_html(invalid_html, current_price=18.97) is None


def test_default_discovery_uses_official_manufacturer_offer_language():
    terms = walmart_cash_search_terms(None)
    assert terms[0] == "manufacturer offers"
    assert "get walmart cash" in terms
''')
          PY
      - name: Validate focused fix
        run: |
          python -m py_compile sniperplug/services/walmart_cash_api_truth.py sniperplug/services/walmart_pdp_cash_proof.py sniperplug/services/walmart_cash_offers.py tests/test_walmart_cash_proven_filter.py
          python -m pytest -q tests/test_walmart_cash_proven_filter.py
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sniperplug/services/walmart_cash_api_truth.py sniperplug/services/walmart_pdp_cash_proof.py sniperplug/services/walmart_cash_offers.py tests/test_walmart_cash_proven_filter.py
          git commit -m "Harden Walmart Cash proof and manufacturer-offer discovery"
          git push origin HEAD:fix/walmart-cash-proven-filter
