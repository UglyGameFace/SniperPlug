name: Apply Walmart exact search cleanup

on:
  push:
    branches:
      - fix/walmart-missed-deal-throughput
    paths:
      - tools/apply_walmart_exact_search_cleanup.py
      - .github/workflows/apply-walmart-exact-search-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walmart-missed-deal-throughput
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply cleanup
        run: python tools/apply_walmart_exact_search_cleanup.py
      - name: Validate focused recovery path
        run: |
          git diff --check
          python -m compileall -q sniperplug tests
          pytest -q tests/test_walmart_page_identity_recovery.py tests/test_walmart_exact_public_lane.py tests/test_walmart_exact_queue_runtime.py
      - name: Commit validated cleanup
        run: |
          git config user.name "UglyGameFace"
          git config user.email "85308991+UglyGameFace@users.noreply.github.com"
          git rm tools/apply_walmart_exact_search_cleanup.py .github/workflows/apply-walmart-exact-search-cleanup.yml
          git add sniperplug tests
          git diff --cached --check
          git commit -m "Avoid duplicate Walmart exact search before page fallback"
          git push origin HEAD:fix/walmart-missed-deal-throughput
