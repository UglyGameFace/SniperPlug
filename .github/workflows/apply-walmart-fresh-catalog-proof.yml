name: Apply Walmart fresh catalog proof

on:
  push:
    branches: [fix/walmart-fresh-catalog-proof]
    paths:
      - tools/apply_walmart_fresh_catalog_proof.py
      - .github/workflows/apply-walmart-fresh-catalog-proof.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walmart-fresh-catalog-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply deterministic source edits
        run: python tools/apply_walmart_fresh_catalog_proof.py
      - name: Inspect patch whitespace
        run: git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Compile changed Python surface
        run: python -m compileall -q sniperplug tests *.py
      - name: Run focused Walmart reliability regressions
        run: >-
          pytest -q
          tests/test_walmart_fresh_discovery_proof.py
          tests/test_walmart_exact_queue_runtime.py
          tests/test_walmart_exact_queue_drain.py
          tests/test_walmart_exact_verification_queue_bulk.py
          tests/test_walmart_catalog_queue_write_suppression.py
          tests/test_walmart_exact_queue_bulk_persistence.py
          tests/test_walmart_page_identity_recovery.py
          tests/test_walmart_exact_public_lane.py
      - name: Commit validated implementation and remove applicator
        run: |
          git config user.name "UglyGameFace"
          git config user.email "85308991+UglyGameFace@users.noreply.github.com"
          git add ACTIVE_TASK.md sniperplug tests
          git rm tools/apply_walmart_fresh_catalog_proof.py .github/workflows/apply-walmart-fresh-catalog-proof.yml
          git commit -m "Reuse fresh Walmart catalog offer proof safely"
          git push origin HEAD:fix/walmart-fresh-catalog-proof
