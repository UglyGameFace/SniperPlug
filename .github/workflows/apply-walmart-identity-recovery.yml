name: Apply Walmart Identity Recovery Patch

on:
  push:
    branches:
      - fix/walmart-identity-recovery-view

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walmart-identity-recovery-view
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact scoped patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "sniperplug/bot.py",
              "from sniperplug.providers.walmart import WalmartAffiliateConfig, WalmartProvider\n",
              "from sniperplug.providers.walmart import WalmartAffiliateConfig\n"
              "from sniperplug.providers.walmart_page_recovery import (\n"
              "    WalmartPageRecoveryProvider,\n"
              "    rearm_recent_identity_rows_for_page_recovery,\n"
              ")\n",
          )
          replace_once(
              "sniperplug/bot.py",
              "        walmart_provider = WalmartProvider(walmart_affiliate_config(self.settings))\n",
              "        walmart_provider = WalmartPageRecoveryProvider(\n"
              "            walmart_affiliate_config(self.settings)\n"
              "        )\n",
          )
          replace_once(
              "sniperplug/bot.py",
              "        log.info(\n"
              "            \"Walmart provider registered: enabled=%s configured=%s publisher_id=%s\",\n"
              "            walmart_provider.config.enabled,\n"
              "            walmart_provider.config.configured,\n"
              "            bool(walmart_provider.config.publisher_id),\n"
              "        )\n\n"
              "        # Canonical command surface. Legacy cogs may remain importable as helper\n",
              "        log.info(\n"
              "            \"Walmart provider registered: enabled=%s configured=%s publisher_id=%s page_identity_recovery=true\",\n"
              "            walmart_provider.config.enabled,\n"
              "            walmart_provider.config.configured,\n"
              "            bool(walmart_provider.config.publisher_id),\n"
              "        )\n"
              "        try:\n"
              "            rearmed_identity_rows = await rearm_recent_identity_rows_for_page_recovery(\n"
              "                self.db\n"
              "            )\n"
              "            log.info(\n"
              "                \"Walmart page identity recovery migration ready: recent_rows_rearmed=%s max_rearm=%s window_hours=%s\",\n"
              "                rearmed_identity_rows,\n"
              "                250,\n"
              "                72,\n"
              "            )\n"
              "        except Exception:\n"
              "            log.exception(\n"
              "                \"Walmart page identity recovery migration failed safely; provider fallback remains active\"\n"
              "            )\n\n"
              "        # Canonical command surface. Legacy cogs may remain importable as helper\n",
          )

          replace_once(
              "sniperplug/cogs/canonical_public_alerts.py",
              "        url = str(getattr(item.card, \"url\", \"\") or \"\") if item.card else \"\"\n",
              "        url = str(\n"
              "            (getattr(item.card, \"url\", \"\") if item.card else \"\")\n"
              "            or item.product_url\n"
              "            or \"\"\n"
              "        )\n",
          )

          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "        if recovery.proof is None:\n"
              "            return _mark_page_recovery(payload, recovery.status, recovery.detail)\n",
              "        if recovery.proof is None:\n"
              "            if recovery.status == \"price_mismatch\":\n"
              "                raise WalmartProviderError(\n"
              "                    \"Walmart product-page identity recovery saw a price mismatch for \"\n"
              "                    f\"{clean_item_id}: {recovery.detail or 'selected offer changed'}; \"\n"
              "                    \"retrying instead of binding a seller\"\n"
              "                )\n"
              "            return _mark_page_recovery(payload, recovery.status, recovery.detail)\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "    candidates: list[tuple[int, WalmartPageIdentityProof]] = []\n"
              "    for node, path in matching_nodes:\n",
              "    candidates: list[tuple[int, WalmartPageIdentityProof]] = []\n"
              "    mismatched_prices: list[float] = []\n"
              "    for node, path in matching_nodes:\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "                if _price_to_cents(api_item_price) != _price_to_cents(proof.current_price):\n"
              "                    continue\n",
              "                if _price_to_cents(api_item_price) != _price_to_cents(proof.current_price):\n"
              "                    mismatched_prices.append(proof.current_price)\n"
              "                    continue\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "    if not candidates:\n"
              "        status = \"no_price_aligned_seller\" if api_item_price is not None else \"seller_identity_missing\"\n"
              "        return WalmartPageRecoveryResult(None, status)\n",
              "    if not candidates:\n"
              "        if api_item_price is not None and mismatched_prices:\n"
              "            distinct = sorted({round(price, 2) for price in mismatched_prices})\n"
              "            sample = \", \".join(f\"${price:.2f}\" for price in distinct[:3])\n"
              "            return WalmartPageRecoveryResult(\n"
              "                None,\n"
              "                \"price_mismatch\",\n"
              "                f\"official API item price ${api_item_price:.2f} did not match page offer price(s) {sample}\",\n"
              "            )\n"
              "        status = \"no_price_aligned_seller\" if api_item_price is not None else \"seller_identity_missing\"\n"
              "        return WalmartPageRecoveryResult(None, status)\n",
          )
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Compile scoped implementation
        run: |
          python -m compileall -q \
            sniperplug/providers/walmart_page_recovery.py \
            sniperplug/bot.py \
            sniperplug/cogs/canonical_public_alerts.py \
            tests/test_walmart_page_identity_recovery.py

      - name: Targeted regression suite
        run: |
          pytest -q \
            tests/test_walmart_page_identity_recovery.py \
            tests/test_walmart_recovery_command_static.py \
            tests/test_walmart_delivery_recovery.py \
            tests/test_walmart_exact_offer_identity_payload.py \
            tests/test_walmart_selected_offer_delivered_price.py \
            tests/test_walmart_exact_queue_runtime.py

      - name: Conflict and whitespace inspection
        run: |
          git diff --check
          git status --short
          grep -R "WalmartPageRecoveryProvider" -n sniperplug tests
          grep -R "page_identity_recovery=true" -n sniperplug/bot.py

      - name: Commit validated patch and remove temporary applicator
        shell: bash
        run: |
          git rm .github/workflows/apply-walmart-identity-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug tests
          git diff --cached --check
          git commit -m "Fix Walmart identity recovery and manual inspection"
          git push origin HEAD:fix/walmart-identity-recovery-view
