name: Apply Walmart live buy-box proof hardening

on:
  push:
    branches:
      - fix/walmart-page-live-buybox-proof

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/walmart-page-live-buybox-proof
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply guarded implementation patches
        run: |
          python .github/scripts/apply_walmart_live_buybox.py
          python .github/scripts/fix_walmart_selected_offer_proof.py
          python .github/scripts/fix_walmart_buybox_seller_aliases.py
          python .github/scripts/trim_walmart_live_buybox_test_eof.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Focused Walmart regressions
        run: |
          pytest -q \
            tests/test_walmart_page_identity_recovery.py \
            tests/test_walmart_selected_offer_delivered_price.py \
            tests/test_walmart_exact_offer_identity_payload.py \
            tests/test_walmart_delivery_recovery.py \
            tests/test_walmart_recovery_review_fixes.py

      - name: Static and dependency validation
        run: |
          pip check
          python -m compileall -q sniperplug tests *.py
          git diff --check

      - name: Full regression suite
        run: pytest -q

      - name: Commit implementation and remove applicators
        run: |
          rm -f .github/workflows/apply-walmart-live-buybox-proof.yml
          rm -f .github/scripts/apply_walmart_live_buybox.py
          rm -f .github/scripts/fix_walmart_selected_offer_proof.py
          rm -f .github/scripts/fix_walmart_buybox_seller_aliases.py
          rm -f .github/scripts/trim_walmart_live_buybox_test_eof.py
          git diff --check
          git config user.name "UglyGameFace"
          git config user.email "85308991+UglyGameFace@users.noreply.github.com"
          git add -A
          git commit -m "Recover live Walmart buy-box seller and shipping proof"
          git push origin HEAD:fix/walmart-page-live-buybox-proof
