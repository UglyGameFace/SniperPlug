name: Export SniperPlug repository

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-site-port
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/sniperplug-site-parity
          fetch-depth: 1
      - name: Verify one-time marker
        run: test -f .site-port/READY
      - name: Download source template
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ae78-81f5-93c1-9bf75b31da70/raw?se=2026-07-28T19:11:30Z&sp=r&sv=2026-02-06&sr=b&scid=e0c24d7b-14cc-5ff5-8efd-37b17cf80256&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-28T07:20:17Z&ske=2026-07-30T07:20:17Z&sks=b&skv=2026-02-06&sig=Ues/qLCDlvb2S8qJGrKcSWYX2qkEIITCjI2/uzV83/g%3D'
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output /tmp/lobby-template.zip
          mkdir -p /tmp/lobby-template
          unzip -q /tmp/lobby-template.zip -d /tmp/lobby-template
      - name: Reconstruct audited website
        run: |
          rm -rf website
          mkdir -p website
          rsync -a \
            --exclude='.github' \
            --exclude='ACTIVE_TASK.md' \
            --exclude='reports' \
            --exclude='vercel.json' \
            --exclude='README.md' \
            /tmp/lobby-template/ website/
          cat .site-port/patch.part.* | base64 --decode | gzip --decompress > /tmp/sniperplug-site.patch
          git apply --binary /tmp/sniperplug-site.patch
      - name: Commit one clean site snapshot
        run: |
          rm -rf .site-port
          rm -f .github/workflows/apply-sniperplug-site-port.yml
          rm -f .github/workflows/export-sniperplug-repo.yml
          git config user.name 'SniperPlug Site Port'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Port Lobby site architecture to SniperPlug'
          git push origin HEAD:agent/sniperplug-site-parity
