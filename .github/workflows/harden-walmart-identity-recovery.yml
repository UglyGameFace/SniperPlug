name: Harden Walmart Identity Recovery

on:
  push:
    branches:
      - fix/walmart-identity-recovery-view

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walmart-identity-recovery-view
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harden exact-offer binding and manual link safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:140]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "import re\nimport time\nimport urllib.error\nimport urllib.request\n",
              "import re\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "            final_url = str(getattr(response, \"geturl\", lambda: url)() or url)\n"
              "            if \"walmart.com\" not in final_url.lower():\n"
              "                raise WalmartPageRecoveryTransientError(\"product page redirected away from walmart.com\")\n",
              "            final_url = str(getattr(response, \"geturl\", lambda: url)() or url)\n"
              "            final_host = (urllib.parse.urlparse(final_url).hostname or \"\").lower().rstrip(\".\")\n"
              "            if final_host != \"walmart.com\" and not final_host.endswith(\".walmart.com\"):\n"
              "                raise WalmartPageRecoveryTransientError(\n"
              "                    \"product page redirected away from walmart.com\"\n"
              "                )\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "    if _raw_seller_identity(product) != (None, None):\n"
              "        yield product, path, 70\n",
              "    if _raw_seller_identity_shallow(product) != (None, None):\n"
              "        yield product, path, 70\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "            if id(current) not in yielded and _raw_seller_identity(current) != (None, None):\n",
              "            if (\n"
              "                id(current) not in yielded\n"
              "                and _raw_seller_identity_shallow(current) != (None, None)\n"
              "            ):\n",
          )
          replace_once(
              "sniperplug/providers/walmart_page_recovery.py",
              "    if not seller_name and not seller_id:\n"
              "        seller_name, seller_id = _raw_seller_identity(product)\n",
              "    if not seller_name and not seller_id:\n"
              "        seller_name, seller_id = _raw_seller_identity_shallow(product)\n",
          )

          replace_once(
              "sniperplug/cogs/canonical_public_alerts.py",
              "        url = str(\n"
              "            (getattr(item.card, \"url\", \"\") if item.card else \"\")\n"
              "            or item.product_url\n"
              "            or \"\"\n"
              "        )\n",
              "        card_url = str(getattr(item.card, \"url\", \"\") or \"\") if item.card else \"\"\n"
              "        if card_url:\n"
              "            url = card_url\n"
              "        elif str(item.item_id or \"\").isdigit():\n"
              "            url = f\"https://www.walmart.com/ip/{item.item_id}\"\n"
              "        else:\n"
              "            url = str(item.product_url or \"\")\n",
          )

          replace_once(
              "sniperplug/bot.py",
              "from sniperplug.providers.walmart_page_recovery import (\n"
              "    WalmartPageRecoveryProvider,\n"
              "    rearm_recent_identity_rows_for_page_recovery,\n"
              ")\n",
              "from sniperplug.providers.walmart_page_recovery import (\n"
              "    PAGE_RECOVERY_REARM_LIMIT,\n"
              "    PAGE_RECOVERY_REARM_WINDOW_HOURS,\n"
              "    WalmartPageRecoveryProvider,\n"
              "    rearm_recent_identity_rows_for_page_recovery,\n"
              ")\n",
          )
          replace_once(
              "sniperplug/bot.py",
              "                250,\n"
              "                72,\n",
              "                PAGE_RECOVERY_REARM_LIMIT,\n"
              "                PAGE_RECOVERY_REARM_WINDOW_HOURS,\n",
          )

          test_path = Path("tests/test_walmart_page_identity_recovery.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_nested_offer_seller_cannot_be_borrowed_for_another_offer_price() -> None:\n"
          if marker in tests:
              raise SystemExit("hardening regression tests already present")
          tests += '''\n\ndef test_nested_offer_seller_cannot_be_borrowed_for_another_offer_price() -> None:\n    script = json.dumps(\n        {\n            "@type": "Product",\n            "sku": "1008",\n            "currentPrice": "10.00",\n            "offers": [\n                {"price": "10.00"},\n                {"price": "20.00", "seller": {"name": "Seller B"}},\n            ],\n        }\n    )\n\n    result = recover_page_identity_from_scripts(\n        [script],\n        item_id="1008",\n        api_item_price=10.0,\n    )\n\n    assert result.proof is None\n    assert result.status in {"seller_identity_missing", "price_mismatch", "no_price_aligned_seller"}\n\n\ndef test_redirect_host_must_be_walmart_domain(monkeypatch) -> None:\n    from sniperplug.providers import walmart_page_recovery as page_recovery\n\n    class FakeResponse:\n        def __enter__(self):\n            return self\n\n        def __exit__(self, *_args):\n            return False\n\n        def geturl(self):\n            return "https://walmart.com.evil.example/ip/1009"\n\n        def read(self, _size):\n            return b""\n\n    monkeypatch.setattr(page_recovery.urllib.request, "urlopen", lambda *_args, **_kwargs: FakeResponse())\n\n    try:\n        page_recovery._request_product_page_scripts("1009", 3.0)\n    except page_recovery.WalmartPageRecoveryTransientError as exc:\n        assert "redirected away" in str(exc)\n    else:\n        raise AssertionError("lookalike redirect host must not be trusted")\n'''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Compile implementation
        run: |
          python -m compileall -q sniperplug tests

      - name: Targeted regression suite
        run: |
          pytest -q \
            tests/test_walmart_page_identity_recovery.py \
            tests/test_walmart_recovery_command_static.py \
            tests/test_walmart_delivery_recovery.py \
            tests/test_walmart_exact_offer_identity_payload.py \
            tests/test_walmart_selected_offer_delivered_price.py \
            tests/test_walmart_exact_queue_runtime.py \
            tests/test_walmart_offer_price_safety_edges.py

      - name: Cleanup and conflict inspection
        run: |
          git diff --check
          grep -R "_raw_seller_identity(product)" -n sniperplug/providers/walmart_page_recovery.py && exit 1 || true
          grep -R '"walmart.com" not in final_url' -n sniperplug/providers/walmart_page_recovery.py && exit 1 || true
          test ! -e .github/workflows/apply-walmart-identity-recovery.yml

      - name: Commit hardening and remove temporary applicator
        shell: bash
        run: |
          git rm .github/workflows/harden-walmart-identity-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug tests
          git diff --cached --check
          git commit -m "Harden Walmart page offer identity binding"
          git push origin HEAD:fix/walmart-identity-recovery-view
