name: One-shot active cache isolation

on:
  push:
    branches:
      - audit/full-discord-deal-bot-recovery
    paths:
      - .github/workflows/one_shot_active_cache_isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-discord-deal-bot-recovery
          fetch-depth: 0
      - name: Patch active cache isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/services/public_deal_posts.py')
          text = path.read_text()
          old = '''    cached = 0
    for card in cards:
        retailer = normalize_retailer_key(getattr(card, "retailer", None)) or normalize_retailer_key(fallback_retailer)
        if not retailer:
            continue
        if not is_public_deal_candidate(card, source_label=source_label, min_discount=min_discount):
            continue
        url = getattr(card, "url", "") or ""
        key = active_cache_key(
            retailer=retailer,
            url=url,
            selected_offer_id=getattr(card, "selected_offer_id", None),
            sku=getattr(card, "sku", None),
            upc=getattr(card, "upc", None),
        )
        await conn.execute(
            """
            INSERT INTO guild_active_deal_cache (
                guild_id, active_key, retailer, title, url, current_price, discount, score, source_label, status, first_seen_at, last_seen_at
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 'active', ?, ?)
            ON CONFLICT(guild_id, active_key) DO UPDATE SET
                title = excluded.title,
                url = excluded.url,
                current_price = excluded.current_price,
                discount = excluded.discount,
                score = excluded.score,
                source_label = excluded.source_label,
                status = 'active',
                last_seen_at = excluded.last_seen_at
            """,
            (
                guild_id,
                key,
                retailer,
                getattr(card, "label", None) or "deal",
                url,
                getattr(card, "current_price", None),
                getattr(card, "discount", None),
                getattr(card, "score", None),
                source_label,
                now,
                now,
            ),
        )
        cached += 1
    await conn.commit()
    return cached
'''
          new = '''    cached = 0
    for card in cards:
        retailer = normalize_retailer_key(getattr(card, "retailer", None)) or normalize_retailer_key(fallback_retailer)
        if not retailer:
            continue
        try:
            if not is_public_deal_candidate(card, source_label=source_label, min_discount=min_discount):
                continue
            url = getattr(card, "url", "") or ""
            key = active_cache_key(
                retailer=retailer,
                url=url,
                selected_offer_id=getattr(card, "selected_offer_id", None),
                sku=getattr(card, "sku", None),
                upc=getattr(card, "upc", None),
            )
            await conn.execute(
                """
                INSERT INTO guild_active_deal_cache (
                    guild_id, active_key, retailer, title, url, current_price, discount, score, source_label, status, first_seen_at, last_seen_at
                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 'active', ?, ?)
                ON CONFLICT(guild_id, active_key) DO UPDATE SET
                    title = excluded.title,
                    url = excluded.url,
                    current_price = excluded.current_price,
                    discount = excluded.discount,
                    score = excluded.score,
                    source_label = excluded.source_label,
                    status = 'active',
                    last_seen_at = excluded.last_seen_at
                """,
                (
                    guild_id,
                    key,
                    retailer,
                    getattr(card, "label", None) or "deal",
                    url,
                    getattr(card, "current_price", None),
                    getattr(card, "discount", None),
                    getattr(card, "score", None),
                    source_label,
                    now,
                    now,
                ),
            )
            await conn.commit()
            cached += 1
        except Exception as exc:
            rollback = getattr(conn, "rollback", None)
            if callable(rollback):
                try:
                    await rollback()
                except Exception:
                    pass
            print(f"active deal cache skipped one malformed card for guild={guild_id} retailer={retailer}: {clean_error_text(exc)}")
            continue
    return cached
'''
          if old not in text:
              raise SystemExit('active cache batch block not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_active_cache_write_isolation_static.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_active_cache_writes_are_isolated_per_card():\n    source = Path("sniperplug/services/public_deal_posts.py").read_text()\n    start = source.index("async def cache_active_deal_cards")\n    end = source.index("async def ensure_public_post_tables", start)\n    block = source[start:end]\n    assert "await conn.commit()" in block\n    assert "rollback = getattr(conn, \"rollback\", None)" in block\n    assert "continue" in block\n    assert block.rfind("await conn.commit()") < block.rfind("except Exception as exc:")\n''')

          Path('.github/workflows/one_shot_active_cache_isolation.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/services/public_deal_posts.py tests/test_active_cache_write_isolation_static.py .github/workflows/one_shot_active_cache_isolation.yml
          git commit -m "Isolate active cache writes per posted card"
          git push origin HEAD:audit/full-discord-deal-bot-recovery
