name: One-shot active cache isolation v2

on:
  push:
    branches:
      - audit/full-discord-deal-bot-recovery
    paths:
      - .github/workflows/one_shot_active_cache_isolation_v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-discord-deal-bot-recovery
          fetch-depth: 0
      - name: Patch active cache isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/services/public_deal_posts.py')
          text = path.read_text()
          start = text.index('async def cache_active_deal_cards(')
          end = text.index('\n\nasync def ensure_public_post_tables', start)
          block = text[start:end]
          if 'rollback = getattr(conn, "rollback", None)' in block:
              raise SystemExit('active cache isolation already present')
          block = block.replace('''        if not is_public_deal_candidate(card, source_label=source_label, min_discount=min_discount):
            continue
        url = getattr(card, "url", "") or ""
''', '''        try:
            if not is_public_deal_candidate(card, source_label=source_label, min_discount=min_discount):
                continue
            url = getattr(card, "url", "") or ""
''', 1)
          block = block.replace('''        cached += 1
    await conn.commit()
    return cached
''', '''            await conn.commit()
            cached += 1
        except Exception as exc:
            rollback = getattr(conn, "rollback", None)
            if callable(rollback):
                try:
                    await rollback()
                except Exception:
                    pass
            print(f"active deal cache skipped one malformed card for guild={guild_id} retailer={retailer}: {clean_error_text(exc)}")
            continue
    return cached
''', 1)
          lines = block.splitlines()
          try_line = next(i for i, line in enumerate(lines) if line == '        try:')
          commit_line = next(i for i, line in enumerate(lines) if 'await conn.commit()' in line)
          for i in range(try_line + 1, commit_line):
              if lines[i].startswith('        ') and lines[i].strip():
                  lines[i] = '    ' + lines[i]
          block = '\n'.join(lines)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          test = Path('tests/test_active_cache_write_isolation_static.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_active_cache_writes_are_isolated_per_card():\n    source = Path("sniperplug/services/public_deal_posts.py").read_text()\n    start = source.index("async def cache_active_deal_cards")\n    end = source.index("async def ensure_public_post_tables", start)\n    block = source[start:end]\n    assert "rollback = getattr(conn, \\\"rollback\\\", None)" in block\n    assert block.index("await conn.commit()") < block.index("except Exception as exc:")\n''')
          Path('.github/workflows/one_shot_active_cache_isolation_v2.yml').unlink()
          PY
      - name: Validate and commit
        run: |
          python -m py_compile sniperplug/services/public_deal_posts.py tests/test_active_cache_write_isolation_static.py
          python -m pytest -q tests/test_active_cache_write_isolation_static.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/services/public_deal_posts.py tests/test_active_cache_write_isolation_static.py .github/workflows/one_shot_active_cache_isolation_v2.yml
          git commit -m "Isolate active cache writes per posted card"
          git push origin HEAD:audit/full-discord-deal-bot-recovery
