name: One-shot autoscan guild discovery isolation

on:
  push:
    branches:
      - audit/full-discord-deal-bot-recovery
    paths:
      - .github/workflows/one_shot_autoscan_guild_discovery_isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-discord-deal-bot-recovery
          fetch-depth: 0
      - name: Patch autoscan guild discovery isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/cogs/auto_scan_runner.py')
          text = path.read_text()
          old = '''    for row in rows:\n        guild_id = int(row["guild_id"])\n\n        if live_guild_ids is not None and guild_id not in live_guild_ids:\n            log.warning(\n                "Auto-scan deleted stale/ghost public-alert guild row guild=%s live_guilds=%s. Run /setup_sniperplug_here in the live server if this server still needs alerts.",\n                guild_id,\n                sorted(live_guild_ids),\n            )\n            await delete_ghost_public_alert_guild_row(db, guild_id)\n            continue\n\n        config = await get_public_alert_config(db, guild_id)\n        if AUTO_SCAN_RETAILER in set(config.get("retailers") or ()) and config.get("channel_id"):\n            if guild_id in seen:\n                continue\n            seen.add(guild_id)\n            guilds.append(AutoScanGuild(guild_id=guild_id, channel_id=int(config["channel_id"])))\n'''
          new = '''    for row in rows:\n        try:\n            raw_guild_id = row["guild_id"]\n        except Exception:\n            try:\n                raw_guild_id = row[0]\n            except Exception:\n                log.warning("Auto-scan skipped malformed public-alert row without guild_id: %r", row)\n                continue\n        try:\n            guild_id = int(raw_guild_id)\n        except (TypeError, ValueError):\n            log.warning("Auto-scan skipped malformed public-alert guild id: %r", raw_guild_id)\n            continue\n\n        if live_guild_ids is not None and guild_id not in live_guild_ids:\n            log.warning(\n                "Auto-scan deleted stale/ghost public-alert guild row guild=%s live_guilds=%s. Run /setup_sniperplug_here in the live server if this server still needs alerts.",\n                guild_id,\n                sorted(live_guild_ids),\n            )\n            try:\n                await delete_ghost_public_alert_guild_row(db, guild_id)\n            except Exception:\n                log.exception("Auto-scan failed to clean stale guild row but discovery will continue guild=%s", guild_id)\n            continue\n\n        try:\n            config = await get_public_alert_config(db, guild_id)\n        except Exception:\n            log.exception("Auto-scan skipped guild because public-alert config could not be read guild=%s", guild_id)\n            continue\n        if AUTO_SCAN_RETAILER not in set(config.get("retailers") or ()) or not config.get("channel_id"):\n            continue\n        try:\n            channel_id = int(config["channel_id"])\n        except (TypeError, ValueError):\n            log.warning("Auto-scan skipped guild with malformed public-alert channel id guild=%s channel=%r", guild_id, config.get("channel_id"))\n            continue\n        if guild_id in seen:\n            continue\n        seen.add(guild_id)\n        guilds.append(AutoScanGuild(guild_id=guild_id, channel_id=channel_id))\n'''
          if old not in text:
              raise SystemExit('guild discovery anchor not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_autoscan_guild_discovery_isolation_static.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_autoscan_guild_discovery_isolates_bad_rows_and_configs():\n    source = Path("sniperplug/cogs/auto_scan_runner.py").read_text()\n    start = source.index("async def list_public_alert_guilds")\n    end = source.index("def autoscan_blocker_summary", start)\n    block = source[start:end]\n    assert "Auto-scan skipped malformed public-alert guild id" in block\n    assert "public-alert config could not be read" in block\n    assert "malformed public-alert channel id" in block\n    assert "continue" in block\n''')

          Path('.github/workflows/one_shot_autoscan_guild_discovery_isolation.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/cogs/auto_scan_runner.py tests/test_autoscan_guild_discovery_isolation_static.py .github/workflows/one_shot_autoscan_guild_discovery_isolation.yml
          git commit -m "Isolate malformed autoscan guild rows"
          git push origin HEAD:audit/full-discord-deal-bot-recovery
