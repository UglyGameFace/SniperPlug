name: One-shot public category gate

on:
  push:
    branches:
      - audit/full-discord-deal-bot-recovery
    paths:
      - .github/workflows/one_shot_public_category_gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-discord-deal-bot-recovery
          fetch-depth: 0
      - name: Patch public posting gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/services/public_deal_posts.py')
          text = path.read_text()

          anchor = '''    if not config["enabled"] or not config["channel_id"]:\n        return PublicPostResult(attempted=attempted, skipped_disabled=attempted)\n\n'''
          replacement = '''    if not config["enabled"] or not config["channel_id"]:\n        return PublicPostResult(attempted=attempted, skipped_disabled=attempted)\n\n    try:\n        from sniperplug.services.deal_category_preferences import get_category_preferences\n\n        category_preferences = await get_category_preferences(db, guild_id)\n    except Exception as exc:\n        return PublicPostResult(\n            attempted=attempted,\n            errors=(f"public category preference read failed; posting blocked: {clean_error_text(exc)}",),\n        )\n\n'''
          if anchor not in text:
              raise SystemExit('config anchor not found')
          text = text.replace(anchor, replacement, 1)

          loop_anchor = '''    for card in cards:\n        retailer = normalize_retailer_key(getattr(card, "retailer", None)) or fallback_key\n'''
          loop_replacement = '''    for card in cards:\n        try:\n            from sniperplug.services.deal_category_preferences import decide_category\n\n            category_decision = decide_category(card, category_preferences)\n        except Exception as exc:\n            notes.append(f"public category decision failed; card blocked: {clean_error_text(exc)}")\n            skipped_not_alertable += 1\n            continue\n        if category_decision.action == "suppress":\n            skipped_not_alertable += 1\n            continue\n\n        retailer = normalize_retailer_key(getattr(card, "retailer", None)) or fallback_key\n'''
          if loop_anchor not in text:
              raise SystemExit('loop anchor not found')
          text = text.replace(loop_anchor, loop_replacement, 1)
          path.write_text(text)

          test = Path('tests/test_public_category_gate_static.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_public_posting_gate_enforces_category_preferences():\n    source = Path("sniperplug/services/public_deal_posts.py").read_text()\n    assert "category_preferences = await get_category_preferences(db, guild_id)" in source\n    assert "if category_decision.action == \\"suppress\\":" in source\n    assert "public category preference read failed; posting blocked" in source\n    assert source.index("if category_decision.action == \\"suppress\\":") < source.index("reserve_public_deal_post(")\n''')

          Path('.github/workflows/one_shot_public_category_gate.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/services/public_deal_posts.py tests/test_public_category_gate_static.py .github/workflows/one_shot_public_category_gate.yml
          git commit -m "Enforce category mutes in public posting gate"
          git push origin HEAD:audit/full-discord-deal-bot-recovery
