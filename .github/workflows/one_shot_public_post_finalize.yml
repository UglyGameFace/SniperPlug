name: One-shot durable public post finalization

on:
  push:
    branches:
      - audit/full-discord-deal-bot-recovery
    paths:
      - .github/workflows/one_shot_public_post_finalize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-discord-deal-bot-recovery
          fetch-depth: 0
      - name: Patch durable posting finalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/services/public_deal_posts.py')
          text = path.read_text()

          old = '''        try:\n            await mark_public_deal_posted(db, guild_id=guild_id, deal_key=deal_key)\n        except Exception as exc:\n            notes.append(f"public post state write failed for {retailer}: {clean_error_text(exc)}")\n\n        try:\n            await db.record_alert_dedupe(\n                guild_id=guild_id,\n                retailer=retailer,\n                product_key=product_key,\n                alert_key=alert_key,\n                current_price=current_price,\n                channel_id=getattr(channel, "id", config["channel_id"]),\n                message_id=getattr(message, "id", None),\n                threshold_price=current_price,\n                expires_at=alert_expires_at(hours=SCOUT_ALERT_DEDUPE_HOURS if allow_review_scout else None),\n            )\n        except Exception as exc:\n            notes.append(f"alert dedupe write failed for {retailer}: {clean_error_text(exc)}")\n'''
          new = '''        finalized, finalize_notes = await finalize_successful_public_post(\n            db,\n            guild_id=guild_id,\n            retailer=retailer,\n            deal_key=deal_key,\n            product_key=product_key,\n            alert_key=alert_key,\n            current_price=current_price,\n            channel_id=getattr(channel, "id", config["channel_id"]),\n            message_id=getattr(message, "id", None),\n            allow_review_scout=allow_review_scout,\n        )\n        notes.extend(finalize_notes)\n        if not finalized:\n            notes.append(\n                f"CRITICAL: public post for {retailer} was sent but no durable duplicate guard could be confirmed; "\n                "the reservation was intentionally retained for stale-time protection"\n            )\n'''
          if old not in text:
              raise SystemExit('post finalization anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''async def mark_public_deal_posted(db, *, guild_id: int, deal_key: str) -> None:\n'''
          helper = '''async def finalize_successful_public_post(\n    db,\n    *,\n    guild_id: int,\n    retailer: str,\n    deal_key: str,\n    product_key: str,\n    alert_key: str,\n    current_price: float | None,\n    channel_id: int | str | None,\n    message_id: int | str | None,\n    allow_review_scout: bool,\n) -> tuple[bool, list[str]]:\n    notes: list[str] = []\n    posted_state_saved = False\n    dedupe_saved = False\n\n    for attempt in range(1, 3):\n        try:\n            await mark_public_deal_posted(db, guild_id=guild_id, deal_key=deal_key)\n            posted_state_saved = True\n            break\n        except Exception as exc:\n            if attempt == 2:\n                notes.append(f"public post state write failed for {retailer} after retry: {clean_error_text(exc)}")\n\n    for attempt in range(1, 3):\n        try:\n            await db.record_alert_dedupe(\n                guild_id=guild_id,\n                retailer=retailer,\n                product_key=product_key,\n                alert_key=alert_key,\n                current_price=current_price,\n                channel_id=channel_id,\n                message_id=message_id,\n                threshold_price=current_price,\n                expires_at=alert_expires_at(hours=SCOUT_ALERT_DEDUPE_HOURS if allow_review_scout else None),\n            )\n            dedupe_saved = True\n            break\n        except Exception as exc:\n            if attempt == 2:\n                notes.append(f"alert dedupe write failed for {retailer} after retry: {clean_error_text(exc)}")\n\n    return posted_state_saved or dedupe_saved, notes\n\n\n'''
          if anchor not in text:
              raise SystemExit('mark helper anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old_mark = '''async def mark_public_deal_posted(db, *, guild_id: int, deal_key: str) -> None:\n    conn = db.require_conn()\n    now = datetime.now(timezone.utc).isoformat()\n    await conn.execute(\n        "UPDATE guild_public_deal_posts SET status = 'posted', posted_at = ? WHERE guild_id = ? AND deal_key = ?",\n        (now, guild_id, deal_key),\n    )\n    await conn.commit()\n'''
          new_mark = '''async def mark_public_deal_posted(db, *, guild_id: int, deal_key: str) -> None:\n    conn = db.require_conn()\n    now = datetime.now(timezone.utc).isoformat()\n    await conn.execute(\n        "UPDATE guild_public_deal_posts SET status = 'posted', posted_at = ? WHERE guild_id = ? AND deal_key = ?",\n        (now, guild_id, deal_key),\n    )\n    await conn.commit()\n    cursor = await conn.execute(\n        "SELECT status FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? LIMIT 1",\n        (guild_id, deal_key),\n    )\n    row = await cursor.fetchone()\n    status = row["status"] if row is not None else None\n    if status != "posted":\n        raise RuntimeError("public post reservation could not be confirmed as posted")\n'''
          if old_mark not in text:
              raise SystemExit('mark implementation anchor not found')
          text = text.replace(old_mark, new_mark, 1)
          path.write_text(text)

          test = Path('tests/test_public_post_durable_finalization_static.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_public_post_requires_a_confirmed_durable_duplicate_guard():\n    source = Path("sniperplug/services/public_deal_posts.py").read_text()\n    assert "finalized, finalize_notes = await finalize_successful_public_post(" in source\n    assert "for attempt in range(1, 3):" in source\n    assert "return posted_state_saved or dedupe_saved, notes" in source\n    assert "public post reservation could not be confirmed as posted" in source\n    assert "the reservation was intentionally retained for stale-time protection" in source\n''')

          Path('.github/workflows/one_shot_public_post_finalize.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/services/public_deal_posts.py tests/test_public_post_durable_finalization_static.py .github/workflows/one_shot_public_post_finalize.yml
          git commit -m "Require durable finalization after public posting"
          git push origin HEAD:audit/full-discord-deal-bot-recovery