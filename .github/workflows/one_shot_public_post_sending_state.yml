name: One-shot durable sending state

on:
  push:
    branches:
      - audit/full-discord-deal-bot-recovery
    paths:
      - .github/workflows/one_shot_public_post_sending_state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-discord-deal-bot-recovery
          fetch-depth: 0
      - name: Add durable sending state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sniperplug/services/public_deal_posts.py')
          text = path.read_text()

          send_anchor = '''        try:\n            target = build_feedback_target(\n'''
          send_replacement = '''        try:\n            await mark_public_deal_sending(db, guild_id=guild_id, deal_key=deal_key)\n        except Exception as exc:\n            try:\n                await release_public_deal_reservation(db, guild_id=guild_id, deal_key=deal_key)\n            except Exception:\n                pass\n            notes.append(f"public post delivery-state write failed for {retailer}; send blocked: {clean_error_text(exc)}")\n            continue\n\n        try:\n            target = build_feedback_target(\n'''
          if send_anchor not in text:
              raise SystemExit('send anchor not found')
          text = text.replace(send_anchor, send_replacement, 1)

          stale_anchor = '''    await conn.execute(\n        "DELETE FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? AND status = 'reserved' AND first_seen_at < ?",\n        (guild_id, deal_key, stale_before),\n    )\n'''
          stale_replacement = '''    await conn.execute(\n        "DELETE FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? AND status = 'reserved' AND first_seen_at < ?",\n        (guild_id, deal_key, stale_before),\n    )\n    sending_stale_before = (now_dt - timedelta(days=30)).isoformat()\n    await conn.execute(\n        "DELETE FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? AND status = 'sending' AND first_seen_at < ?",\n        (guild_id, deal_key, sending_stale_before),\n    )\n'''
          if stale_anchor not in text:
              raise SystemExit('stale cleanup anchor not found')
          text = text.replace(stale_anchor, stale_replacement, 1)

          mark_anchor = '''async def finalize_successful_public_post(\n'''
          helper = '''async def mark_public_deal_sending(db, *, guild_id: int, deal_key: str) -> None:\n    conn = db.require_conn()\n    await conn.execute(\n        "UPDATE guild_public_deal_posts SET status = 'sending' WHERE guild_id = ? AND deal_key = ? AND status = 'reserved'",\n        (guild_id, deal_key),\n    )\n    await conn.commit()\n    cursor = await conn.execute(\n        "SELECT status FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? LIMIT 1",\n        (guild_id, deal_key),\n    )\n    row = await cursor.fetchone()\n    status = row["status"] if row is not None else None\n    if status != "sending":\n        raise RuntimeError("public post reservation could not be confirmed as sending")\n\n\n'''
          if mark_anchor not in text:
              raise SystemExit('finalize helper anchor not found')
          text = text.replace(mark_anchor, helper + mark_anchor, 1)

          release_old = '''        "DELETE FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? AND status = 'reserved'",\n'''
          release_new = '''        "DELETE FROM guild_public_deal_posts WHERE guild_id = ? AND deal_key = ? AND status IN ('reserved', 'sending')",\n'''
          if release_old not in text:
              raise SystemExit('release anchor not found')
          text = text.replace(release_old, release_new, 1)

          path.write_text(text)

          test = Path('tests/test_public_post_sending_state_static.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_public_post_persists_sending_state_before_discord_delivery():\n    source = Path("sniperplug/services/public_deal_posts.py").read_text()\n    send_state = source.index("await mark_public_deal_sending(")\n    discord_send = source.index("message = await channel.send", send_state)\n    assert send_state < discord_send\n    assert "status = 'sending'" in source\n    assert "status IN ('reserved', 'sending')" in source\n    assert "timedelta(days=30)" in source\n    assert "public post reservation could not be confirmed as sending" in source\n''')

          Path('.github/workflows/one_shot_public_post_sending_state.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sniperplug/services/public_deal_posts.py tests/test_public_post_sending_state_static.py .github/workflows/one_shot_public_post_sending_state.yml
          git commit -m "Persist sending state before public delivery"
          git push origin HEAD:audit/full-discord-deal-bot-recovery
