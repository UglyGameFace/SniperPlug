name: Python Check

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/walmart-cash-proven-filter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Apply Walmart Cash hardening
        run: python tools/apply_walmart_cash_hardening.py

      - name: Reject vague and nearby-price Cash matches
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "sniperplug/services/walmart_cash_api_truth.py",
              "sniperplug/services/walmart_pdp_cash_proof.py",
          ):
              path = Path(name)
              lines = path.read_text().splitlines(keepends=True)
              kept = [line for line in lines if 'r"walmart\\s+cash[^' not in line]
              if len(kept) == len(lines):
                  raise SystemExit(f"unsafe reverse Cash amount pattern missing in {name}")
              path.write_text("".join(kept))

          pdp = Path("sniperplug/services/walmart_pdp_cash_proof.py")
          text = pdp.read_text()
          nearest_money = '''    money_matches = list(re.finditer(r"\\$\\s*(\\d+(?:\\.\\d{1,2})?)", raw))
    nearby_money = [match for match in money_matches if abs(match.start() - cash_index) <= 90]
    if nearby_money:
        best = min(nearby_money, key=lambda match: abs(match.start() - cash_index))
        return _float_or_none(best.group(1))

'''
          if nearest_money not in text:
              raise SystemExit("PDP nearest-dollar shortcut missing")
          pdp.write_text(text.replace(nearest_money, "", 1))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run focused Walmart Cash regressions
        run: python -m pytest -q tests/test_walmart_cash_proven_filter.py

      - name: Commit proven Walmart Cash changes
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sniperplug/services/walmart_cash_api_truth.py sniperplug/services/walmart_pdp_cash_proof.py sniperplug/services/walmart_cash_offers.py tests/test_walmart_cash_proven_filter.py
          if git diff --cached --quiet; then
            echo "Walmart Cash source already hardened"
          else
            git commit -m "Harden Walmart Cash proof and manufacturer-offer discovery"
            git push origin HEAD:fix/walmart-cash-proven-filter
          fi

      - name: Compile Python files
        run: python -m compileall -q sniperplug scripts tests

      - name: Run import smoke check
        run: python scripts/smoke_imports.py

      - name: Run full test suite
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q
